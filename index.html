<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Loader</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #000;
        color: #1683ff;
        font-family: Consolas, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        width: min(700px, 90%);
        background: #050505;
        border: 1px solid #1683ff;
        padding: 30px;
        box-shadow: 0 0 30px #0066ff33;
    }

    .title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 25px;
    }

    .status {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
    }

    .bar {
        width: 100%;
        height: 24px;
        background: #111;
        border: 1px solid #1683ff;
        display: flex;
        gap: 2px;
        padding: 3px;
    }

    .fill {
        width: 0%;
        background: #1683ff;
        box-shadow: 0 0 10px #1683ff;
        transition: width .05s linear;
    }

    .info {
        margin-top: 12px;
        color: #777;
    }

    .invite {
        display: none;
        margin-top: 25px;
        padding: 20px;
        border: 1px solid #1683ff;
        text-align: center;
    }

    .invite a {
        color: #1683ff;
        text-decoration: none;
        font-size: 20px;
    }
</style>
</head>

<body>

<div class="container">

    <div class="title">INVITE CONNECTION</div>

    <div class="status">
        <span id="status">PULLING INVITE</span>
        <span id="percent">0%</span>
    </div>

    <div class="bar">
        <div class="fill" id="fill"></div>
    </div>

    <div class="info" id="info">
        INITIALIZING CONNECTION...
    </div>

    <div class="invite" id="invite">
        <div>INVITE READY</div>
        <br>
        <a href="https://discord.gg/HCn3sGSEBu" target="_blank">
            discord.gg/HCn3sGSEBu
        </a>
    </div>

</div>

<script>
const stages = [
    [0, 2500, "PULLING INVITE"],
    [2500, 5000, "CONNECTING TO INVITE"],
    [5000, 7500, "VERIFYING INVITE"],
    [7500, 10000, "DISPLAYING INVITE"]
];

const messages = [
    "INITIALIZING CONNECTION...",
    "LOCATING INVITE...",
    "READING INVITE DATA...",
    "CHECKING CONNECTION...",
    "PREPARING DISPLAY...",
    "FINALIZING..."
];

let i = 0;

const fill = document.getElementById("fill");
const percent = document.getElementById("percent");
const status = document.getElementById("status");
const info = document.getElementById("info");
const invite = document.getElementById("invite");

const interval = setInterval(() => {

    i++;

    let stage = stages.find(x => i >= x[0] && i <= x[1]);

    if (stage) {
        status.textContent = stage[2];
    }

    const progress = i / 10000;

    fill.style.width = (progress * 100) + "%";
    percent.textContent = Math.floor(progress * 100) + "%";

    info.textContent =
        messages[Math.floor(i / 700) % messages.length];

    if (i >= 10000) {
        clearInterval(interval);

        status.textContent = "INVITE READY";
        percent.textContent = "100%";
        info.textContent = "CONNECTION COMPLETE";

        invite.style.display = "block";
    }

}, 0.3);
</script>

</body>
</html>
